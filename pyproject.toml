[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ucav-aerostealth"
version = "0.1.0"
description = "Reproducible geometry and graph utilities for the UCAV aero-stealth research pipeline."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[project.scripts]
ucav-prepare-2d = "ucav_aerostealth.cli.prepare_2d:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
